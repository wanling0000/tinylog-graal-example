plugins {
    id "base"
    id "java"
    id "application"
}

import org.gradle.internal.os.OperatingSystem

ext {
    javaMainClass = "demo.Application"
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.tinylog:tinylog-api:2.1.1"
    implementation "org.tinylog:tinylog-impl:2.1.1"
}

application {
    mainClass = javaMainClass
}

tasks.register("generateConfiguration", Exec) {
    group = "graal"
    description = "Run application to generate the configuration for native image generation"
    dependsOn(tasks.jar)

    def outputDir = layout.buildDirectory.dir("native-image-agent/META-INF/native-image")
    def os = OperatingSystem.current()
    def javaExeName = os.isWindows() ? "java.exe" : "java"

    doFirst {
        def out = outputDir.get().asFile
        out.mkdirs()

        def javaHome = System.getenv("JAVA_HOME")
        if (!javaHome) {
            throw new GradleException("JAVA_HOME is not set. Please set JAVA_HOME to a GraalVM JDK (with native-image).")
        }

        def javaBin = file("${javaHome}/bin/${javaExeName}")
        if (!javaBin.exists()) {
            throw new GradleException("Cannot find ${javaBin}. Check JAVA_HOME.")
        }

        println "Using java: ${javaBin.absolutePath}"
        println "Writing native-image configs to: ${out}"

        executable = javaBin.absolutePath
        args(
                "-agentlib:native-image-agent=config-output-dir=${out.absolutePath}",
                "-cp", sourceSets.main.runtimeClasspath.asPath,
                javaMainClass
        )
    }
}

tasks.register("nativeImage", Exec) {
    group = "graal"
    description = "Build native image using JAVA_HOME GraalVM (no palantir plugin)"

    dependsOn(tasks.generateConfiguration)

    def os = OperatingSystem.current()
    def nativeImageExeName = os.isWindows() ? "native-image.cmd" : "native-image"

    def outDirProvider = layout.buildDirectory.dir("graal")
    def configDirProvider = layout.buildDirectory.dir("native-image-agent/META-INF/native-image")
    def jarTask = tasks.named("jar", Jar)

    doFirst {
        def outDir = outDirProvider.get().asFile
        outDir.mkdirs()

        def javaHome = System.getenv("JAVA_HOME")
        if (!javaHome) {
            throw new GradleException("JAVA_HOME is not set. Please set JAVA_HOME to a GraalVM JDK (with native-image).")
        }

        def nativeImageExe = file("${javaHome}/bin/${nativeImageExeName}")
        if (!nativeImageExe.exists()) {
            throw new GradleException("Cannot find ${nativeImageExe}. Check JAVA_HOME and whether native-image is installed.")
        }

        def jarFile = jarTask.get().archiveFile.get().asFile
        def configDir = configDirProvider.get().asFile

        println "Using native-image: ${nativeImageExe.absolutePath}"
        println "Jar: ${jarFile.absolutePath}"
        println "Config dir: ${configDir.absolutePath}"
        println "Output: ${new File(outDir, "demo").absolutePath}"

        executable = nativeImageExe.absolutePath

        def cp = sourceSets.main.runtimeClasspath.asPath
        args(
                "-cp", cp,
                "-o", new File(outDir, "demo").absolutePath,
                "-H:ConfigurationFileDirectories=${configDir.absolutePath}",
                javaMainClass,

                "--no-fallback"
        )
    }
}

